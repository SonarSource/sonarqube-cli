name: Setup Bun Environment
description: Setup mise, cache Bun dependencies, and install

inputs:
  artifactory-username:
    description: Artifactory private reader username
    required: true
  artifactory-password:
    description: Artifactory private reader access token
    required: true

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        version: 2026.4.20

    - name: Cache Bun dependencies
      uses: SonarSource/gh-action_cache@339d9d71cc5210bfa866a831dd8eba8e32c40491 # v1.7.1
      with:
        path: |
          ~/.bun
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: bun-${{ runner.os }}

    - name: Install dependencies
      shell: bash
      env:
        ARTIFACTORY_PRIVATE_READER_USERNAME: ${{ inputs.artifactory-username }}
        ARTIFACTORY_PRIVATE_READER_PASSWORD: ${{ inputs.artifactory-password }}
        BUN_CONFIG_REGISTRY: https://repox.jfrog.io/artifactory/api/npm/npm/
        NPM_CONFIG_REGISTRY: https://repox.jfrog.io/artifactory/api/npm/npm/
      run: bun ci
