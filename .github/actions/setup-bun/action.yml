name: Setup Bun Environment
description: Setup mise tools and install Bun dependencies

inputs:
  artifactory-username:
    description: Artifactory private reader username
    required: true
  artifactory-password:
    description: Artifactory private reader access token
    required: true

  java-version:
    description: Optional Java version to install alongside Bun
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: step-security/mise-action@a225bbd7c202ddf57dd76dff22bb7992f6314173 # v5.1.2
      with:
        version: 2026.11.9
        tool_versions: ${{ inputs.java-version != '' && format('java {0}', inputs.java-version) || '' }}

    - name: Install dependencies
      shell: bash
      env:
        ARTIFACTORY_PRIVATE_READER_USERNAME: ${{ inputs.artifactory-username }}
        ARTIFACTORY_PRIVATE_READER_PASSWORD: ${{ inputs.artifactory-password }}
        BUN_CONFIG_REGISTRY: https://repox.jfrog.io/artifactory/api/npm/npm/
        NPM_CONFIG_REGISTRY: https://repox.jfrog.io/artifactory/api/npm/npm/
      run: bun ci
