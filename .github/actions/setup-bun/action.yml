name: Setup Bun Environment
description: Install Bun (pinned via mise.toml), cache Bun dependencies, and install

inputs:
  artifactory-username:
    description: Artifactory private reader username
    required: true
  artifactory-password:
    description: Artifactory private reader access token
    required: true

runs:
  using: composite
  steps:
    - name: Read Bun version from mise.toml
      id: bun-version
      shell: bash
      run: |
        version=$(grep -E '^bun\s*=' mise.toml | sed -E 's/.*"([^"]+)".*/\1/')
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun-version.outputs.version }}

    - name: Cache Bun dependencies
      uses: SonarSource/gh-action_cache@55df12d329333911afa3e89a9b558fbf47dcd61c # v1.4.4
      with:
        path: |
          ~/.bun
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: bun-${{ runner.os }}

    - name: Install dependencies
      shell: bash
      env:
        ARTIFACTORY_PRIVATE_READER_USERNAME: ${{ inputs.artifactory-username }}
        ARTIFACTORY_PRIVATE_READER_PASSWORD: ${{ inputs.artifactory-password }}
      run: bun ci
