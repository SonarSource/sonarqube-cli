name: Setup Bun Environment
description: Setup mise, configure the Bun registry and install Bun dependencies

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        version: 2026.9.14

    - name: Configure Bun registry
      uses: SonarSource/ci-github-actions/config-bun@fef7a32ff2276a44c2bfdff0bd388f3cd3ef0092 # 2.5.0
      with:
        # bun.lock pins tarballs to the prod Edge, so GitHub-hosted runners must use it too (macOS reaches it through WARP).
        repox-url: https://repox-internal.sonar.build

    - name: Export reader for build scripts
      shell: bash
      run: |
        echo "ARTIFACTORY_PRIVATE_READER_USERNAME=$ARTIFACTORY_USERNAME" >> "$GITHUB_ENV"
        echo "ARTIFACTORY_PRIVATE_READER_PASSWORD=$ARTIFACTORY_ACCESS_TOKEN" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: bun ci
