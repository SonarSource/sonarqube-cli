---
name: Update release channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version the channel should point at (e.g. 0.9.0.977).
        required: true
        type: string
      channel:
        description: Release channel to update.
        required: true
        type: choice
        options:
          - latest
          - stable
          - dogfood

jobs:
  update-channel:
    runs-on: sonar-xs
    environment: release-channel-admin
    permissions:
      id-token: write # OIDC → Vault
      contents: read
    steps:
      - uses: SonarSource/ci-github-actions/update-release-channel@21206070b4306949454171904b8d2b4ec349b0c5 # 2.0.1
        with:
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
