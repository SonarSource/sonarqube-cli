---
name: Update release channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version the channel should point at (e.g. 0.9.0.977).
        required: true
        type: string
      channel:
        description: Release channel to update.
        required: true
        type: choice
        options:
          - latest
          - stable
          - dogfood

jobs:
  update-channel:
    runs-on: sonar-xs
    environment: release-channel-admin
    permissions:
      id-token: write # OIDC → Vault
      contents: read
    steps:
      - uses: SonarSource/ci-github-actions/update-release-channel@2759d5d89dc0d776a00ba934e7cbb1e59b8d2078 # master
        with:
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
