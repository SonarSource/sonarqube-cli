name: Build

on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

# Workflow-level concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

# Required permissions for Vault OIDC and repo operations
permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    name: Prepare Build
    runs-on: github-ubuntu-latest-s
    outputs:
      BUILD_NUMBER: ${{ steps.get-build-number.outputs.BUILD_NUMBER }}
      PROJECT_VERSION: ${{ steps.project_version.outputs.PROJECT_VERSION }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.8.14

      - uses: SonarSource/ci-github-actions/get-build-number@de29c54be07c772c6afc381db8ae4bfcbfe4df12 # 1.8.0
        id: get-build-number

      - name: Update package.json version with build number
        id: project_version
        env:
          BUILD_NUMBER: ${{ steps.get-build-number.outputs.BUILD_NUMBER }}
        run: |
          PROJECT_VERSION=$(bun build-scripts/set-build-number.ts "${BUILD_NUMBER}")
          echo "PROJECT_VERSION=${PROJECT_VERSION}" >> $GITHUB_OUTPUT

  build-binaries:
    name: Build All Binaries
    runs-on: github-ubuntu-latest-m
    needs: prepare
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/kv/data/sign key | GPG_SIGNING_KEY;
            development/kv/data/sign passphrase | GPG_SIGNING_PASSPHRASE;

      - uses: ./.github/actions/setup-bun
        with:
          artifactory-username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          artifactory-password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

      - name: Fetch binary signatures
        run: bun run fetch:signatures

      - name: Cross-compile all platform binaries
        shell: bash
        env:
          PROJECT_VERSION: ${{ needs.prepare.outputs.PROJECT_VERSION }}
        run: |
          set -euo pipefail

          build_binary() {
            local target="$1"
            local classifier="$2"
            local extension="$3"
            local filename="sonarqube-cli-${PROJECT_VERSION}-${classifier}.${extension}"

            SONARQUBE_CLI_TARGET="$target" SONARQUBE_CLI_OUTFILE="dist/${filename}" bun build-scripts/build-binary.ts
          }

          build_binary bun-linux-x64 linux-x86-64 bin
          build_binary bun-linux-arm64 linux-arm64 bin
          build_binary bun-darwin-arm64 macos-arm64 bin
          build_binary bun-windows-x64 windows-x86-64 exe

      - name: GPG-sign all binaries
        shell: bash
        env:
          GPG_SIGNING_KEY: ${{ fromJSON(steps.secrets.outputs.vault).GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ fromJSON(steps.secrets.outputs.vault).GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail

          while IFS= read -r -d '' binary; do
            bun build-scripts/sign.ts "$binary"
          done < <(find dist -maxdepth 1 -type f \( -name '*.bin' -o -name '*.exe' \) -print0)

      - name: Upload linux-x86-64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-linux-x86-64
          if-no-files-found: error
          path: |
            dist/*-linux-x86-64.bin
            dist/*-linux-x86-64.bin.asc

      - name: Upload linux-arm64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-linux-arm64
          if-no-files-found: error
          path: |
            dist/*-linux-arm64.bin
            dist/*-linux-arm64.bin.asc

      - name: Upload macos-arm64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-macos-arm64
          if-no-files-found: error
          path: |
            dist/*-macos-arm64.bin
            dist/*-macos-arm64.bin.asc

      - name: Upload windows-x86-64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-windows-x86-64
          if-no-files-found: error
          path: |
            dist/*-windows-x86-64.exe
            dist/*-windows-x86-64.exe.asc

  sign-macos:
    name: Sign and Notarize macOS Binaries
    runs-on: macos-latest-xlarge
    needs: [prepare, build-binaries]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'branch-')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Cloudflare WARP
        uses: SonarSource/gh-action_setup-cloudflare-warp@fe31a2b2f31595cffdef290985700732cb3469d6 # v2.1.0

      - name: Download macos binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-macos-arm64
          path: dist/

      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/kv/data/sign/sonarqube-cli CERTIFICATE | CERTIFICATE;
            development/kv/data/sign/sonarqube-cli CSC_KEY_PASSWORD | CSC_KEY_PASSWORD;
            development/kv/data/sign/sonarqube-cli APPLE_TEAM_ID | APPLE_TEAM_ID;
            development/kv/data/sign/sonarqube-cli APPLE_ID | APPLE_ID;
            development/kv/data/sign/sonarqube-cli APPLE_APP_SPECIFIC_PASSWORD | APPLE_APP_SPECIFIC_PASSWORD;
            development/kv/data/sign key | GPG_SIGNING_KEY;
            development/kv/data/sign passphrase | GPG_SIGNING_PASSPHRASE;

      - uses: ./.github/actions/setup-bun
        with:
          artifactory-username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          artifactory-password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

      - name: Code-sign and notarize macOS binaries
        shell: bash
        env:
          CERTIFICATE: ${{ fromJSON(steps.secrets.outputs.vault).CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ fromJSON(steps.secrets.outputs.vault).APPLE_TEAM_ID }}
          APPLE_ID: ${{ fromJSON(steps.secrets.outputs.vault).APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm /tmp/certificate.p12

          sign_macos_binary() {
            local binary="$1"
            local archive="/tmp/$(basename "$binary").zip"

            codesign --sign "Developer ID Application: SonarSource Sarl ($APPLE_TEAM_ID)" --identifier sonarqube-cli --options runtime --timestamp "$binary"
            codesign --verify --verbose "$binary"

            zip "$archive" "$binary"
            xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            rm "$archive"
          }

          while IFS= read -r -d '' binary; do
            sign_macos_binary "$binary"
          done < <(find dist -maxdepth 1 -type f -name '*-macos-arm64.bin' -print0)

      - name: Clean up build keychain
        if: always()
        run: |
          security default-keychain -s ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          security delete-keychain build.keychain 2>/dev/null || true

      - name: Re-GPG-sign macOS binaries
        shell: bash
        env:
          GPG_SIGNING_KEY: ${{ fromJSON(steps.secrets.outputs.vault).GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ fromJSON(steps.secrets.outputs.vault).GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail

          while IFS= read -r -d '' binary; do
            bun build-scripts/sign.ts "$binary"
          done < <(find dist -maxdepth 1 -type f -name '*-macos-arm64.bin' -print0)

      - name: Upload signed macOS binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-macos-signed
          path: |
            dist/*-macos-arm64.bin
            dist/*-macos-arm64.bin.asc

  publish-binaries:
    name: Publish Binaries to Artifactory
    runs-on: github-ubuntu-latest-s
    needs:
      - prepare
      - build-binaries
      - sign-macos
      - scan
    if: ${{ !cancelled() && !failure() && (github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'branch-') || startsWith(github.ref_name, 'dogfood-on-')) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e # v5.1.0
        with:
          version: 2.77.0

      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-qa-deployer access_token | ARTIFACTORY_DEPLOY_PASSWORD;
            development/kv/data/sentry/sq-ide-upload token | SENTRY_AUTH_TOKEN;

      - uses: ./.github/actions/setup-bun
        with:
          artifactory-username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          artifactory-password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      - name: Download signed macOS binaries
        if: needs.sign-macos.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-macos-signed
          path: dist/

      - name: Copy user scripts to dist
        run: cp user-scripts/install.sh user-scripts/install.ps1 dist/

      - name: Upload binaries to Artifactory
        env:
          ARTIFACTORY_URL: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_URL }}
          ARTIFACTORY_DEPLOY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_PASSWORD }}
          PROJECT_VERSION: ${{ needs.prepare.outputs.PROJECT_VERSION }}
          ARTIFACTORY_DEPLOY_REPO: sonarsource-public-qa
          PROJECT: ${{ github.event.repository.name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.BUILD_NUMBER }}
          ARTIFACTS_TO_PUBLISH: 'org.sonarsource.cli:sonarqube-cli:bin:linux-x86-64,org.sonarsource.cli:sonarqube-cli:bin:linux-arm64,org.sonarsource.cli:sonarqube-cli:bin:macos-arm64,org.sonarsource.cli:sonarqube-cli:exe:windows-x86-64'
        run: |
          jf config add repox \
            --artifactory-url="${ARTIFACTORY_URL}" \
            --access-token="${ARTIFACTORY_DEPLOY_PASSWORD}"
          jf rt upload \
            "dist/*" \
            "${ARTIFACTORY_DEPLOY_REPO}/org/sonarsource/cli/sonarqube-cli/${PROJECT_VERSION}/" \
            --server-id=repox \
            --flat=true \
            --build-name="${PROJECT}" \
            --build-number="${BUILD_NUMBER}" \
            --module="org.sonarsource.cli:${PROJECT}:${PROJECT_VERSION}"
          jf rt build-collect-env "${PROJECT}" "${BUILD_NUMBER}"
          jf rt build-publish "${PROJECT}" "${BUILD_NUMBER}"

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: sonar-x0
          SENTRY_PROJECT: sonarqube-cli
          PROJECT_VERSION: ${{ needs.prepare.outputs.PROJECT_VERSION }}
          ARTIFACTORY_PRIVATE_READER_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PRIVATE_READER_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        # source maps are not generated with single-file executable, need to rebuild the binary
        run: |
          bun build src/index.ts --outdir ./dist --sourcemap=external --target=bun
          bun run sentry:upload-sourcemaps

  lint:
    name: Lint
    runs-on: github-ubuntu-latest-s
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - uses: ./.github/actions/setup-bun
        with:
          artifactory-username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          artifactory-password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

      - name: Check style
        run: bun format:check

      - name: Check linting
        run: bun lint

      - name: Type check
        run: bun typecheck

  unit-tests:
    name: Unit Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: github-ubuntu-latest-m
          - os: windows
            runner: warp-custom-windows-2022-s
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - uses: ./.github/actions/setup-bun
        with:
          artifactory-username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          artifactory-password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

      - name: Run unit tests (Windows)
        if: matrix.os == 'windows'
        run: bun test:unit

      - name: Run unit tests with coverage (Linux)
        if: matrix.os == 'linux'
        run: bun run test:coverage:unit

      - name: Generate unit lcov from Istanbul data (Linux)
        if: matrix.os == 'linux'
        run: bun build-scripts/report-coverage.ts

      - name: Upload unit coverage (Linux)
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: tests/coverage/reports/unit/

  integration-and-e2e:
    name: Integration and E2E Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    needs: [prepare, build-binaries]
    strategy:
      matrix:
        include:
          - os: linux
            runner: github-ubuntu-latest-m
            binary_artifact: binary-linux-x86-64
          - os: windows
            runner: warp-custom-windows-2022-s
            binary_artifact: binary-windows-x86-64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/kv/data/devex-claude-code API_KEY | CLAUDE_CODE_API_KEY;
            development/team/sonarlint/kv/data/sonarcloud-it token | SONARCLOUD_IT_TOKEN;
            development/team/sonarlint/kv/data/sonarcloud-it-US token | SONARCLOUD_IT_TOKEN_US;

      - name: Install keychain dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0 gnome-keyring dbus-x11

      - uses: ./.github/actions/setup-bun
        with:
          artifactory-username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          artifactory-password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

      - name: Download platform binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.binary_artifact }}
          path: dist/

      - name: Place platform binary
        shell: bash
        env:
          PROJECT_VERSION: ${{ needs.prepare.outputs.PROJECT_VERSION }}
        run: |
          set -euo pipefail

          if [ "${{ matrix.os }}" = "linux" ]; then
            artifact="sonarqube-cli-${PROJECT_VERSION}-linux-x86-64.bin"
            cp "dist/${artifact}" dist/sonarqube-cli
            chmod +x dist/sonarqube-cli
          else
            artifact="sonarqube-cli-${PROJECT_VERSION}-windows-x86-64.exe"
            cp "dist/${artifact}" dist/sonarqube-cli.exe
          fi

      - name: Setup integration resources
        run: bun build-scripts/setup-integration-resources.ts

      - name: Start D-Bus and unlock keyring (Linux)
        if: matrix.os == 'linux'
        run: |
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          mkdir -p ~/.local/share/keyrings
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --components=secrets)"
          if [ -n "$GNOME_KEYRING_CONTROL" ]; then
            echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
          fi

      - name: Build coverage binary (Linux)
        if: matrix.os == 'linux'
        run: |
          bun build-scripts/build-coverage-binary.ts
          bun build-scripts/clear-coverage-raw.ts

      - name: Run integration tests (Windows)
        if: matrix.os == 'windows'
        run: bun run test:integration

      - name: Run integration tests with coverage (Linux)
        if: matrix.os == 'linux'
        run: SONARQUBE_CLI_USE_COVERAGE=1 bun run test:integration

      # Workaround for CAG-933: CAG deduces the fake SonarQube Cloud API endpoint
      # as api.localhost. That resolution is platform-specific; Windows CI does not
      # resolve it by default. Pin api.localhost to loopback so the e2e test
      # "forwards a Claude Bash hook payload to the real CAG binary and applies
      # Gradle compression" can reach the fake server until CAG fixes this.
      - name: Resolve fake SonarQube Cloud API host (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          Add-Content -Path "$env:windir\System32\drivers\etc\hosts" -Value "`n127.0.0.1 api.localhost`n::1 api.localhost"
          Resolve-DnsName api.localhost

      - name: Run e2e tests (Windows)
        if: matrix.os == 'windows'
        env:
          CLAUDE_CODE_API_KEY: ${{ fromJSON(steps.secrets.outputs.vault).CLAUDE_CODE_API_KEY }}
          SONARCLOUD_IT_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONARCLOUD_IT_TOKEN }}
          SONARCLOUD_IT_TOKEN_US: ${{ fromJSON(steps.secrets.outputs.vault).SONARCLOUD_IT_TOKEN_US }}
        run: bun run test:e2e

      - name: Run e2e tests with coverage (Linux)
        if: matrix.os == 'linux'
        env:
          CLAUDE_CODE_API_KEY: ${{ fromJSON(steps.secrets.outputs.vault).CLAUDE_CODE_API_KEY }}
          SONARCLOUD_IT_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONARCLOUD_IT_TOKEN }}
          SONARCLOUD_IT_TOKEN_US: ${{ fromJSON(steps.secrets.outputs.vault).SONARCLOUD_IT_TOKEN_US }}
        run: SONARQUBE_CLI_USE_COVERAGE=1 bun run test:e2e

      - name: Merge coverage reports (Linux)
        if: matrix.os == 'linux'
        run: bun build-scripts/report-coverage.ts

      - name: Upload integration coverage (Linux)
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-coverage
          path: tests/coverage/reports/integration/

  scan:
    name: SonarQube Analysis
    runs-on: github-ubuntu-latest-s
    needs: [prepare, lint, unit-tests, integration-and-e2e]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
        with:
          secrets: |
            development/kv/data/sonarcloud token | SONAR_TOKEN;
            development/kv/data/sonarcloud url | SONAR_URL;
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - uses: ./.github/actions/setup-bun
        with:
          artifactory-username: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          artifactory-password: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-coverage
          path: tests/coverage/reports/unit/

      - name: Download integration coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-coverage
          path: tests/coverage/reports/integration/

      - name: Analyze on SonarQubeCloud
        env:
          SONAR_HOST_URL: ${{ fromJSON(steps.secrets.outputs.vault).SONAR_URL }}
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONAR_TOKEN }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.BUILD_NUMBER }}
          CURRENT_VERSION: ${{ needs.prepare.outputs.PROJECT_VERSION }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PULL_REQUEST: ${{ github.event.pull_request.number || 'false' }}
        run: |
          .github/scripts/sonarqube-analysis.sh

  promote:
    runs-on: github-ubuntu-latest-s
    name: Promote
    needs:
      - prepare
      - build-binaries
      - sign-macos
      - publish-binaries
      - scan
    if: ${{ !cancelled() && !failure() && (github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'branch-') || startsWith(github.ref_name, 'dogfood-on-')) }}
    steps:
      - uses: SonarSource/ci-github-actions/promote@de29c54be07c772c6afc381db8ae4bfcbfe4df12 # 1.8.0
        env:
          PROJECT_VERSION: ${{ needs.prepare.outputs.PROJECT_VERSION }}
          ARTIFACTORY_DEPLOY_REPO: sonarsource-public-qa
        with:
          promote-pull-request: true
