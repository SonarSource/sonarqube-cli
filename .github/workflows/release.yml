name: sonar-release

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version
        required: true
      dryRun:
        type: boolean
        description: Flag to enable the dry-run execution
        default: false
        required: false

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@07c3b254ac74436e361f4ea8ef70c3e697b9dc48 # 7.6.0
    with:
      version: ${{ inputs.version }}
      dryRun: ${{ inputs.dryRun }}
      publishToBinaries: true
      slackChannel: C02E6L5C01H # squad-devex-private
      skipJavascriptReleasabilityChecks: true
      createDraftRelease: false

  update-stable-channel:
    needs: release
    if: ${{ !inputs.dryRun }}
    runs-on: sonar-xs
    permissions:
      id-token: write # OIDC → Vault
      contents: read
    steps:
      - uses: SonarSource/ci-github-actions/update-release-channel@d41706a4180f70b6c0d0479795309a6c99726022 # master
        with:
          version: ${{ inputs.version }}
          channel: stable
