name: sonar-release

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version
        required: true
      dryRun:
        type: boolean
        description: Flag to enable the dry-run execution
        default: false
        required: false

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@8bd46bd4fd779e5fabd93ed73e99e0b9bdb0be3e # 7.10.1
    with:
      version: ${{ inputs.version }}
      dryRun: ${{ inputs.dryRun }}
      publishToBinaries: true
      slackChannel: C02E6L5C01H # squad-devex-private
      skipJavascriptReleasabilityChecks: true
      createDraftRelease: false

  update-stable-channel:
    needs: release
    if: ${{ !inputs.dryRun }}
    runs-on: sonar-xs
    permissions:
      id-token: write # OIDC → Vault
      contents: read
    steps:
      - uses: SonarSource/ci-github-actions/update-release-channel@e2032bdce92b0675c839fd6a697c8bb0078985d5 # master
        with:
          version: ${{ inputs.version }}
          channel: stable
