schema_version = "1.4"
artifacts = []

[task]
name = "sonar/secrets-context--prompt"
version = "1.0.0"
description = "JTBD 3: a secret pasted in the prompt must not reach the model"
authors = []
keywords = ["sonar-cli"]

[metadata]

[verifier]
environment_mode = "shared"
timeout_sec = 120.0
collect = []

[verifier.env]

[agent]
timeout_sec = 300.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]
SONARQUBE_CLI_TOKEN = "${HB_SONAR_TOKEN}"
SONARQUBE_CLI_ORG = "${HB_SONAR_ORG}"
SONARQUBE_CLI_SERVER = "${HB_SONAR_SERVER:-https://sonarcloud.io}"
SONARQUBE_CLI_SONARCLOUD_URL = "${HB_SONAR_SERVER:-https://sonarcloud.io}"
SONARQUBE_CLI_SONARCLOUD_API_URL = "${HB_SONAR_API_URL:-https://api.sonarcloud.io}"

[environment.healthcheck]
command = "test -f /tmp/sonar-ready"
interval_sec = 2.0
timeout_sec = 5.0
start_period_sec = 0.0
retries = 60
