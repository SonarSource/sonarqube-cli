schema_version = "1.4"
artifacts = []

[task]
name = "sonar/auth--missing-org"
version = "1.0.0"
description = "JTBD 2: get the CLI working when the organization is missing"
authors = []
keywords = ["sonar-cli"]

[metadata]

[verifier]
environment_mode = "shared"
timeout_sec = 120.0
collect = []

[verifier.env]
SONARQUBE_CLI_TOKEN = "${HB_SONAR_TOKEN}"
SONARQUBE_CLI_ORG = "${HB_SONAR_ORG}"
SONARQUBE_CLI_SERVER = "${HB_SONAR_SERVER:-https://sonarcloud.io}"
SONARQUBE_CLI_SONARCLOUD_URL = "${HB_SONAR_SERVER:-https://sonarcloud.io}"
SONARQUBE_CLI_SONARCLOUD_API_URL = "${HB_SONAR_API_URL:-https://api.sonarcloud.io}"

[agent]
timeout_sec = 300.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]
SONARQUBE_CLI_TOKEN = "${HB_SONAR_TOKEN}"
SONARQUBE_CLI_SERVER = "${HB_SONAR_SERVER:-https://sonarcloud.io}"
SONARQUBE_CLI_SONARCLOUD_URL = "${HB_SONAR_SERVER:-https://sonarcloud.io}"
SONARQUBE_CLI_SONARCLOUD_API_URL = "${HB_SONAR_API_URL:-https://api.sonarcloud.io}"

[solution.env]
SONARQUBE_CLI_TOKEN = "${HB_SONAR_TOKEN}"
SONARQUBE_CLI_SERVER = "${HB_SONAR_SERVER:-https://sonarcloud.io}"
SONARQUBE_CLI_SONARCLOUD_URL = "${HB_SONAR_SERVER:-https://sonarcloud.io}"
SONARQUBE_CLI_SONARCLOUD_API_URL = "${HB_SONAR_API_URL:-https://api.sonarcloud.io}"
