<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor trajectories</title>
<style>
@font-face {
  font-family: "Google Sans Code";
  src: url(data:font/ttf;base64,__FONT_BASE64__) format("truetype");
  font-weight: 300 800;
}
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
  --grid: #e1e0d9; --ring: rgba(11, 11, 11, 0.10); --wash: rgba(11, 11, 11, 0.05);
  --accent: #2a78d6;
  --good-text: #006300; --good-wash: #dcefdc;
  --bad-text: #b3261e; --bad-wash: #f7dede;
  --warn-text: #8a5a00; --warn-wash: #fbf0d6;
  --code-bg: #f1f0ec;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Google Sans Code", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
    --grid: #2c2c2a; --ring: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.06);
    --accent: #3987e5;
    --good-text: #0ca30c; --good-wash: #15301a;
    --bad-text: #e66767; --bad-wash: #3a1d1d;
    --warn-text: #f0c46e; --warn-wash: #3a3020;
    --code-bg: #232321;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
  --grid: #2c2c2a; --ring: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.06);
  --accent: #3987e5;
  --good-text: #0ca30c; --good-wash: #15301a;
  --bad-text: #e66767; --bad-wash: #3a1d1d;
  --warn-text: #f0c46e; --warn-wash: #3a3020;
  --code-bg: #232321;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
.bar a.home { color: var(--ink); font-weight: 600; text-decoration: none; }
.btn { border: 1px solid var(--ring); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.btn:hover { background: var(--wash); }
h1 { font-size: 26px; line-height: 1.25; margin: 0; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 28px 0 8px; font-weight: 600; }
.sub { color: var(--ink-2); margin: 4px 0 0; }
.muted { color: var(--ink-3); }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; margin-top: 12px; min-width: 0; }
.mono { font-family: var(--mono); font-size: 13px; }
.agent-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 32px 0 0; flex-wrap: wrap; }
.agent-head h2 { margin: 0; }
.task-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.task-title { font-size: 17px; font-weight: 600; margin: 0; }
.task-id { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--ring); border-radius: 999px; text-decoration: none; color: var(--ink); background: var(--page); }
.chip:hover { background: var(--wash); border-color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good-text); flex: none; }
.dot.bad { background: var(--bad-text); }
.dot.warn { background: var(--warn-text); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--wash); }
.pill.good { background: var(--good-wash); color: var(--good-text); }
.pill.bad { background: var(--bad-wash); color: var(--bad-text); }
.pill.warn { background: var(--warn-wash); color: var(--warn-text); }
.verdict { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.checks { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.tick { font-weight: 700; color: var(--good-text); }
.tick.no { color: var(--bad-text); }
.quote { border-left: 3px solid var(--grid); padding: 2px 0 2px 14px; color: var(--ink-2); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.step .n { width: 24px; height: 24px; border-radius: 50%; background: var(--wash); color: var(--ink-2); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
.step .body { min-width: 0; }
.note { font-size: 13px; color: var(--warn-text); margin: 6px 0 0; }
.rich p { margin: 0 0 8px; overflow-wrap: anywhere; }
.rich p:last-child { margin-bottom: 0; }
.rich ul { margin: 0 0 8px; padding-left: 20px; }
.rich code { font-family: var(--mono); font-size: 13px; background: var(--wash); padding: 1px 5px; border-radius: 4px; }
.call { border: 1px solid var(--ring); border-radius: 8px; margin: 8px 0 0; background: var(--code-bg); overflow: hidden; }
.call.err { border-color: var(--warn-text); }
.call > button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 12px; cursor: pointer; }
.call .cmd { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.call .out { color: var(--ink-3); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.call pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--ring); background: var(--surface); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--mono); max-height: 420px; overflow: auto; }
details.tech { margin-top: 28px; }
details.tech summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 4px 16px; margin: 12px 0 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 6px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="home" href="#">Harbor trajectories</a><button class="btn" id="theme" type="button">Light / dark</button></div>
  <main id="main"></main>
</div>
<script id="data" type="text/plain">__TRIALS_JSON__</script>
<script>
(function () {
  const trials = JSON.parse(decodeURIComponent(document.getElementById('data').textContent.trim()));
  const main = document.getElementById('main');
  const WAIT_SECONDS = 30;
  const PREVIEW_LENGTH = 140;
  const SECONDS_PER_MINUTE = 60;
  const SHORT_SECONDS = 10;

  function el(tag, props, children) {
    const node = document.createElement(tag);
    Object.keys(props || {}).forEach((key) => {
      if (key === 'class') node.className = props[key];
      else if (key === 'text') node.textContent = props[key];
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), props[key]);
      else node.setAttribute(key, props[key]);
    });
    (children || []).forEach((child) => {
      if (child !== null && child !== undefined) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    });
    return node;
  }
  function fmtSeconds(value) {
    if (value === null || value === undefined) return null;
    if (value < SECONDS_PER_MINUTE) return value.toFixed(value < SHORT_SECONDS ? 1 : 0) + ' s';
    return Math.floor(value / SECONDS_PER_MINUTE) + ' min ' + Math.round(value % SECONDS_PER_MINUTE) + ' s';
  }
  const fmtNumber = (value) => (value === null || value === undefined ? '-' : value.toLocaleString('en-US'));
  const fmtCost = (value) => (value === null || value === undefined ? null : '$' + value.toFixed(4));
  const rewardOf = (trial) => (trial.rewards && trial.rewards.reward !== undefined ? trial.rewards.reward : null);
  const keyOf = (trial) => trial.group + '/' + trial.name;
  const linkTo = (trial) => '#' + encodeURIComponent(keyOf(trial));
  const passed = (trial) => !trial.exception && rewardOf(trial) !== null && rewardOf(trial) >= 1;
  const agentLabel = (agent) => ({ 'claude-code': 'Claude Code', codex: 'Codex' })[agent] || agent || 'Unknown agent';

  function statusOf(trial) {
    if (trial.exception) return { text: 'Error', kind: 'warn' };
    if (rewardOf(trial) === null) return { text: 'No result', kind: 'warn' };
    return passed(trial) ? { text: 'Passed', kind: 'good' } : { text: 'Failed', kind: 'bad' };
  }
  function failedCommands(trial) {
    return trial.steps.reduce((sum, step) => sum + step.results.filter((r) => r.isError).length, 0);
  }
  function gapsOf(trial) {
    let previous = null;
    return trial.steps.map((step, index) => {
      const time = step.at ? Date.parse(step.at) : null;
      const gap = previous !== null && time !== null ? (time - previous) / 1000 : null;
      if (time !== null) previous = time;
      const afterAgent = index > 0 && trial.steps[index - 1].source === 'agent';
      return afterAgent ? gap : null;
    });
  }
  function siblingsOf(trial) {
    return trials
      .filter((t) => t.task === trial.task && t.agent === trial.agent && t.model === trial.model)
      .sort((a, b) => String(a.startedAt).localeCompare(String(b.startedAt)) || a.name.localeCompare(b.name));
  }

  function inline(text) {
    return text.split(/(\*\*[^*]+\*\*|`[^`]+`)/).filter(Boolean).map((part) => {
      if (part.length > 4 && part.startsWith('**') && part.endsWith('**')) return el('strong', { text: part.slice(2, -2) });
      if (part.length > 2 && part.startsWith('`') && part.endsWith('`')) return el('code', { text: part.slice(1, -1) });
      return part;
    });
  }
  function richText(text) {
    const wrap = el('div', { class: 'rich' });
    let list = null;
    text.split('\n').forEach((raw) => {
      const line = raw.trim();
      const bullet = /^[-*]\s+(.*)$/.exec(line);
      if (bullet) {
        if (!list) {
          list = el('ul');
          wrap.appendChild(list);
        }
        list.appendChild(el('li', {}, inline(bullet[1])));
        return;
      }
      list = null;
      if (line) wrap.appendChild(el('p', {}, inline(line)));
    });
    return wrap;
  }

  function firstLine(text) {
    const line = text.split('\n').map((l) => l.trim()).find((l) => /\w{2}/.test(l)) || '';
    return line.length > PREVIEW_LENGTH ? line.slice(0, PREVIEW_LENGTH) + '…' : line;
  }
  function callNode(call, results) {
    const result = results.find((r) => r.callId === call.id);
    const shown = call.arguments.command !== undefined ? call.arguments.command : call.arguments.cmd;
    const command = shown !== undefined ? String(shown) : JSON.stringify(call.arguments);
    const label = call.name === 'Bash' ? command : call.name + ' ' + command;
    const body = el('pre', { text: result ? result.content : '(no output recorded)' });
    body.hidden = true;
    const header = el('button', { type: 'button', 'aria-expanded': 'false', onclick() {
      body.hidden = !body.hidden;
      header.setAttribute('aria-expanded', String(!body.hidden));
    } }, [
      el('div', { class: 'cmd', text: label }),
      result ? el('div', { class: 'out', text: '→ ' + firstLine(result.content) }) : null,
    ]);
    return el('div', { class: 'call' + (result && result.isError ? ' err' : '') }, [header, body]);
  }

  function stepNode(step, number, gap) {
    const failed = step.results.some((r) => r.isError);
    const body = el('div', { class: 'body' });
    if (step.message) body.appendChild(richText(step.message));
    step.calls.forEach((call) => body.appendChild(callNode(call, step.results)));
    if (failed) body.appendChild(el('p', { class: 'note', text: 'A command failed here. Click it to read the answer.' }));
    if (gap !== null && gap >= WAIT_SECONDS) body.appendChild(el('p', { class: 'note', text: 'The agent waited ' + fmtSeconds(gap) + ' before this step.' }));
    return el('li', { class: 'step' }, [el('span', { class: 'n', text: String(number) }), body]);
  }

  function checksNode(trial) {
    if (!trial.checks.length) return null;
    return el('ul', { class: 'checks' }, trial.checks.map((check) => el('li', {}, [
      el('span', { class: 'tick' + (check.ok ? '' : ' no'), text: check.ok ? '✓' : '✗' }),
      el('span', { text: check.text }),
    ])));
  }

  function technicalDetails(trial) {
    const s = trial.seconds;
    const rows = [
      ['Agent', agentLabel(trial.agent) + (trial.agentVersion ? ' ' + trial.agentVersion : '')],
      ['Model', trial.model || '-'],
      ['Cost', fmtCost(trial.costUsd) || '-'],
      ['Tokens in / cached / out', fmtNumber(trial.inputTokens) + ' / ' + fmtNumber(trial.cachedTokens) + ' / ' + fmtNumber(trial.outputTokens)],
      ['Time: environment', fmtSeconds(s.environment) || '-'],
      ['Time: agent setup', fmtSeconds(s.agentSetup) || '-'],
      ['Time: agent run', fmtSeconds(s.agent) || '-'],
      ['Time: verifier', fmtSeconds(s.verifier) || '-'],
    ];
    Object.keys(trial.rewards || {}).sort().forEach((key) => rows.push(['Verifier: ' + key, String(trial.rewards[key])]));
    const list = el('dl', { class: 'kv' });
    rows.forEach(([key, value]) => {
      list.appendChild(el('dt', { text: key }));
      list.appendChild(el('dd', { text: value }));
    });
    return el('details', { class: 'tech' }, [el('summary', { text: 'Technical details' }), list]);
  }

  function trialPage(trial) {
    const status = statusOf(trial);
    const siblings = siblingsOf(trial);
    const facts = [fmtSeconds(trial.seconds.agent), trial.steps.length ? trial.steps.length + ' steps' : null, fmtCost(trial.costUsd)].filter(Boolean);
    const page = el('div');
    page.appendChild(el('a', { href: '#', text: '← All results' }));
    page.appendChild(el('h1', { text: trial.taskTitle || trial.task, style: 'margin-top:16px' }));
    page.appendChild(el('p', { class: 'sub', text: [agentLabel(trial.agent), trial.model, 'trial ' + (siblings.indexOf(trial) + 1) + ' of ' + siblings.length].filter(Boolean).join(' · ') }));

    const verdict = el('div', { class: 'card' }, [
      el('div', { class: 'verdict' }, [el('span', { class: 'pill ' + status.kind, text: status.text }), el('span', { class: 'muted', text: facts.join(' · ') })]),
    ]);
    if (trial.exception) verdict.appendChild(el('p', { class: 'note', text: trial.exception }));
    const checks = checksNode(trial);
    if (checks) verdict.appendChild(checks);
    page.appendChild(verdict);

    const request = trial.steps.find((step) => step.source === 'user');
    if (request && request.message) {
      page.appendChild(el('h2', { text: 'What the agent was asked' }));
      page.appendChild(el('div', { class: 'quote' }, [richText(request.message)]));
    }

    const gaps = gapsOf(trial);
    const agentSteps = trial.steps.map((step, index) => ({ step, gap: gaps[index] })).filter((item) => item.step.source === 'agent');
    const last = agentSteps[agentSteps.length - 1];
    const finalAnswer = last && last.step.calls.length === 0 && last.step.message ? last : null;
    const worked = finalAnswer ? agentSteps.slice(0, -1) : agentSteps;

    page.appendChild(el('h2', { text: 'What the agent did' }));
    if (worked.length === 0) {
      page.appendChild(el('p', { class: 'muted', text: 'No steps were recorded for this trial.' }));
    } else {
      page.appendChild(el('ol', { class: 'steps' }, worked.map((item, index) => stepNode(item.step, index + 1, item.gap))));
    }
    if (finalAnswer) {
      page.appendChild(el('h2', { text: 'Final answer of the agent' }));
      page.appendChild(el('div', { class: 'card' }, [richText(finalAnswer.step.message)]));
    }
    page.appendChild(technicalDetails(trial));
    return page;
  }

  function groupBy(items, keyFn) {
    const groups = new Map();
    items.forEach((item) => {
      const key = keyFn(item);
      groups.set(key, (groups.get(key) || []).concat([item]));
    });
    return groups;
  }
  function chipNode(trial, number) {
    const failed = failedCommands(trial);
    const kind = passed(trial) ? (failed ? 'warn' : '') : 'bad';
    const parts = ['Trial ' + number, fmtSeconds(trial.seconds.agent)].filter(Boolean).join(' · ');
    return el('a', { class: 'chip', href: linkTo(trial) }, [
      el('span', { class: 'dot ' + kind }),
      el('span', { text: parts }),
      failed ? el('span', { class: 'muted', text: failed + ' failed command' + (failed > 1 ? 's' : '') }) : null,
    ]);
  }
  function taskCard(task, members) {
    const first = members[0];
    const ordered = siblingsOf(first);
    const done = members.filter(passed).length;
    return el('div', { class: 'card' }, [
      el('div', { class: 'task-head' }, [
        el('p', { class: 'task-title', text: first.taskTitle || task }),
        el('span', { class: 'muted', text: done + ' of ' + members.length + ' passed' }),
      ]),
      first.taskTitle ? el('div', { class: 'task-id', text: task }) : null,
      el('div', { class: 'chips' }, ordered.map((trial, index) => chipNode(trial, index + 1))),
    ]);
  }
  function overviewPage() {
    const page = el('div');
    const done = trials.filter(passed).length;
    page.appendChild(el('h1', { text: 'Results' }));
    page.appendChild(el('p', { class: 'sub', text: done + ' of ' + trials.length + ' trials passed. Click a trial to read what the agent did.' }));
    const byAgent = groupBy(trials, (t) => agentLabel(t.agent) + ' · ' + (t.model || 'unknown model'));
    [...byAgent.keys()].sort().forEach((title) => {
      const members = byAgent.get(title);
      page.appendChild(el('div', { class: 'agent-head' }, [
        el('h2', { text: title }),
        el('span', { class: 'muted', text: members.filter(passed).length + ' of ' + members.length + ' passed' }),
      ]));
      const byTask = groupBy(members, (t) => t.task);
      [...byTask.keys()].sort().forEach((task) => page.appendChild(taskCard(task, byTask.get(task))));
    });
    return page;
  }

  document.getElementById('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.theme = dark ? 'light' : 'dark';
  });
  function render() {
    const hash = decodeURIComponent(location.hash.slice(1));
    const trial = trials.find((t) => keyOf(t) === hash);
    main.replaceChildren(trial ? trialPage(trial) : overviewPage());
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
