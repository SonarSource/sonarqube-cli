<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor trajectories</title>
<style>
@font-face {
  font-family: "Google Sans Code";
  src: url(data:font/ttf;base64,__FONT_BASE64__) format("truetype");
  font-weight: 300 800;
}
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #6e6c68;
  --grid: #e1e0d9; --ring: rgba(11, 11, 11, 0.10); --wash: rgba(11, 11, 11, 0.05);
  --accent: #2a78d6; --accent-wash: #e4effb; --strip: #c3c2b7;
  --good: #64a06b; --good-text: #3d6f45; --good-wash: #f1f6f1;
  --bad: #d17b77; --bad-text: #a8403b; --bad-wash: #f9eeed;
  --warn: #e0b24f; --warn-text: #7a5a1a; --warn-wash: #f6eddb;
  --term-bg: #15171b; --term-fg: #e9e7e2; --term-dim: #8d9099; --term-prompt: #7fb0f2; --term-line: #2a2d33;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Google Sans Code", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
    --grid: #2c2c2a; --ring: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.06);
    --accent: #3987e5; --accent-wash: #1c2c42; --strip: #54544e;
    --good: #4b7050; --good-text: #8bc592; --good-wash: #1b241d;
    --bad: #99524e; --bad-text: #e08a85; --bad-wash: #2a1f1e;
    --warn: #c9a255; --warn-text: #e3c487; --warn-wash: #302a1c;
    --term-bg: #0b0c0e; --term-fg: #e9e7e2; --term-dim: #8d9099; --term-prompt: #7fb0f2; --term-line: #24272c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
  --grid: #2c2c2a; --ring: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.06);
  --accent: #3987e5; --accent-wash: #1c2c42; --strip: #54544e;
  --good: #4b7050; --good-text: #8bc592; --good-wash: #1b241d;
  --bad: #99524e; --bad-text: #e08a85; --bad-wash: #2a1f1e;
  --warn: #c9a255; --warn-text: #e3c487; --warn-wash: #302a1c;
  --term-bg: #0b0c0e; --term-fg: #e9e7e2; --term-dim: #8d9099; --term-prompt: #7fb0f2; --term-line: #24272c;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 72px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 650; text-decoration: none; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: inline-block; position: relative; }
.brand i::after { content: ""; position: absolute; inset: 6px; border: 2px solid #fff; border-radius: 50%; border-top-color: transparent; }
.btn { border: 1px solid var(--ring); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.btn:hover { background: var(--wash); }
h1 { font-size: 30px; line-height: 1.15; margin: 0; font-weight: 650; letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: anywhere; }
.mono { font-family: var(--mono); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 650; }
.muted { color: var(--ink-3); }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 16px; padding: 20px; min-width: 0; }
.stack { display: grid; gap: 14px; margin-top: 14px; }
.figure .v { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.figure .l { color: var(--ink-3); font-size: 13px; }

.model { font-family: var(--mono); font-size: 13px; color: var(--ink-2); background: var(--wash); border-radius: 8px; padding: 2px 9px; }

.ico { width: 20px; height: 20px; flex: none; display: inline-block; vertical-align: -4px; }
.ico.good { color: var(--good); } .ico.bad { color: var(--bad); } .ico.warn { color: var(--warn); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px 3px 8px; border-radius: 999px; font-size: 13px; font-weight: 650; background: var(--wash); }
.pill.good { background: var(--good-wash); color: var(--good-text); }
.pill.bad { background: var(--bad-wash); color: var(--bad-text); }
.pill.warn { background: var(--warn-wash); color: var(--warn-text); }
.pill .ico { width: 16px; height: 16px; vertical-align: -3px; }
.task-head { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
.task-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.task-name { font-family: var(--mono); font-size: 16px; font-weight: 650; margin: 0; overflow-wrap: anywhere; }
.ask-n { font-size: 10px; letter-spacing: .02em; }
.runs { margin-top: 18px; border-top: 1px solid var(--grid); padding-top: 6px; }
.run { display: grid; grid-template-columns: 28px 22px minmax(60px, 1fr) 56px 132px; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 10px; color: var(--ink); text-decoration: none; }
.run:hover { background: var(--wash); }
.run .nm { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--grid); display: grid; place-items: center; font-size: 12px; font-weight: 650; color: var(--ink-2); }
.run .tm { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; min-width: 64px; }
.run .note { color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip { display: flex; gap: 2px; height: 10px; }
.strip i { display: block; height: 100%; border-radius: 3px; background: var(--strip); min-width: 4px; }
.strip i.slow { background: var(--bad); }
.strip.none { border-radius: 3px; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--grid) 4px 6px); }
.title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 18px; }
.sub { color: var(--ink-2); margin: 6px 0 0; }
.verdict { margin-top: 22px; padding: 0; overflow: hidden; }
.banner { display: flex; align-items: center; gap: 14px; padding: 18px 20px; }
.banner.good { background: var(--good-wash); } .banner.bad { background: var(--bad-wash); } .banner.warn { background: var(--warn-wash); }
.banner .ico { width: 30px; height: 30px; }
.banner h2 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
.banner.good h2 { color: var(--good-text); } .banner.bad h2 { color: var(--bad-text); } .banner.warn h2 { color: var(--warn-text); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); border-top: 1px solid var(--ring); }
.stat { padding: 14px 20px; border-right: 1px solid var(--ring); }
.stat:last-child { border-right: 0; }
.stat .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--ink-3); font-size: 12px; }
.checks { padding: 18px 20px 20px; border-top: 1px solid var(--ring); }
.checks-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.check-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.check-list li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; }
.check-list li.ok { background: var(--good-wash); }
.check-list li.ko { background: var(--bad-wash); }
.check-list .lab { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; }
.check-list li.ok .lab { color: var(--good-text); }
.check-list li.ko .lab { color: var(--bad-text); }
.section { margin: 34px 0 10px; }
.timeline { margin-top: 10px; }
.timeline .strip { height: 18px; gap: 3px; }
.timeline .strip button { display: block; height: 100%; border: 0; padding: 0; border-radius: 5px; background: var(--strip); min-width: 6px; cursor: pointer; }
.timeline .strip button.slow { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--strip); }
.legend i.slow { background: var(--bad); }
.steps { list-style: none; margin: 18px 0 0; padding: 0; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 20px; scroll-margin-top: 16px; }
.step::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--grid); }
.step:last-child::before { display: none; }
.step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 2px solid var(--grid); font-size: 13px; font-weight: 650; display: grid; place-items: center; color: var(--ink-2); position: relative; }
.step.slow .n { border-color: var(--bad); }
.step .body { min-width: 0; padding-top: 3px; }
.rich p { margin: 0 0 8px; overflow-wrap: anywhere; }
.rich p:last-child { margin-bottom: 0; }
.rich ul { margin: 0 0 8px; padding-left: 20px; }
.rich code { font-family: var(--mono); font-size: 13px; background: var(--wash); padding: 1px 6px; border-radius: 5px; }
.say { color: var(--ink); margin-bottom: 8px; }
.call { background: var(--term-bg); color: var(--term-fg); border-radius: 12px; margin: 8px 0 0; overflow: hidden; border: 1px solid var(--term-line); }
.call > button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; cursor: pointer; }
.call .cmd { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.call .cmd::before { content: "$ "; color: var(--term-prompt); }
.call .cmd.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.call .more { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--term-line); padding: 8px 14px; color: var(--term-prompt); font: 650 12px var(--sans); cursor: pointer; }
.call .more:hover { text-decoration: underline; }
.call .more[hidden] { display: none; }
.call .top { display: flex; gap: 10px; align-items: flex-start; }
.call .out { color: var(--term-dim); font-family: var(--mono); font-size: 12px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.call .flag { flex: none; font: 650 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: #15171b; background: var(--warn); border-radius: 999px; padding: 2px 8px; margin-left: 8px; }
.call pre { margin: 0; padding: 12px 14px; border-top: 1px solid var(--term-line); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 var(--mono); max-height: 420px; overflow: auto; color: var(--term-fg); }
.note { margin: 8px 0 0; font-size: 13px; font-weight: 600; }
.note.warn { color: var(--warn-text); }
.note.slow { color: var(--bad-text); }
details.tech { margin-top: 34px; }
details.tech summary { cursor: pointer; font-weight: 650; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: 6px 16px; margin: 14px 0 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) {
  .run { grid-template-columns: 28px 22px minmax(40px, 1fr) 52px; }
  .run .note { grid-column: 3 / -1; }
  .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 6px; }
  .stat { border-right: 0; border-bottom: 1px solid var(--ring); }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

.summary { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 10px 0 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); }
.picker { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; align-items: stretch; }
.group .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border: 1px solid var(--ring); border-radius: 999px; background: var(--page); cursor: pointer; }
.tab:hover { background: var(--wash); }
.tab.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tab .ico { width: 15px; height: 15px; vertical-align: 0; }
.tab-name { font-weight: 500; font-family: var(--mono); font-size: 13px; }
.panel { margin-top: 22px; border-top: 0; padding-top: 0; }
.panel h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.task { border: 1px solid var(--ring); border-radius: 14px; background: var(--surface); padding: 14px 16px; }
.task.ko { border-left: 4px solid var(--bad); border-left-width: 3px; }
.task.ok { padding: 0; }
.task-head .facts { margin-left: auto; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.task .runs { margin-top: 6px; border-top: 0; padding-top: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--ink-3); font-size: 14px; }
.crumbs a { font-weight: 600; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.met-fold { margin-top: 12px; }
.met-fold summary { cursor: pointer; color: var(--ink-2); padding: 6px 0; }
.met-fold .check-list { margin-top: 8px; }
.task .strip { height: 8px; gap: 2px; }
.task.ok .task-head .ico { width: 18px; height: 18px; }
.task .run .ico { width: 18px; height: 18px; }
.band { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px 28px; margin-top: 18px; padding: 16px 22px; border: 1px solid var(--ring); border-radius: 16px; background: var(--surface); }
.band .big { font-size: 42px; font-weight: 650; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.band .big span { color: var(--ink-3); font-size: 22px; font-weight: 500; }
.band-label { color: var(--ink); font-size: 18px; font-weight: 650; margin: 0; }
.band-figs { display: flex; gap: 24px; }
.fig .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fig .l { font-size: 12px; color: var(--ink-3); }
.harness { border: 1px solid var(--ring); border-radius: 16px; background: var(--surface); padding: 12px 14px 14px; }
.harness.on { border-color: var(--ink-3); }
.harness-head { display: flex; align-items: baseline; gap: 10px; }
.harness-name { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.harness .tabs { margin-top: 10px; }
.panel h2 .model { font-size: 14px; font-weight: 500; }
@media (max-width: 640px) { .band { grid-template-columns: auto minmax(0, 1fr); } .band-figs { grid-column: 1 / -1; } .harness { width: 100%; } }
@media (min-width: 641px) { .task .run { grid-template-columns: 28px minmax(60px, 1fr) auto; } }
@media (max-width: 640px) { .task .run { grid-template-columns: 28px minmax(40px, 1fr) auto; } .task { padding-left: 12px; padding-right: 12px; } }
.task .task-head { justify-content: flex-start; }
.run .nm.good { background: var(--good-wash); border-color: var(--good); color: var(--good-text); }
.run .nm.bad { background: var(--bad-wash); border-color: var(--bad); color: var(--bad-text); }
.run .nm.warn { background: var(--bad-wash); border-color: var(--bad); color: var(--bad-text); }
.strip i.slow, .timeline .strip button.slow, .legend i.slow { background: var(--bad); }
.overview { margin-top: 18px; border: 1px solid var(--ring); border-radius: 16px; background: var(--surface); overflow: hidden; }
.overview .band { margin: 0; border: 0; border-radius: 0; background: transparent; }
.overview .picker { margin: 0; gap: 0; border-top: 1px solid var(--grid); }
.overview .harness { flex: 1 1 auto; border: 0; border-radius: 0; background: transparent; padding: 14px 22px 16px; }
.overview .harness + .harness { border-left: 1px solid var(--grid); }
.overview .harness.on { background: var(--wash); }
.panel-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
.panel-head h2 { margin: 0; }
.panel-facts { margin-left: auto; color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.panel .stack { margin-top: 14px; }
@media (max-width: 640px) { .overview .harness + .harness { border-left: 0; border-top: 1px solid var(--grid); } }
.task-link { color: inherit; text-decoration: none; text-underline-offset: 5px; }
.task-link:hover, .task-link:focus-visible { color: var(--accent); text-decoration: none; }
.task-link::after { content: " ↗"; font-size: 0.7em; opacity: 0; }
.task-link:hover::after, .task-link:focus-visible::after { opacity: 1; }
.band-label.bad { color: var(--ink); display: flex; align-items: center; gap: 8px; }
.band-date { color: var(--ink-3); font-size: 14px; margin-top: 2px; }
.task.ok > summary { list-style: none; cursor: pointer; padding: 11px 16px; }
.task.ok > summary::-webkit-details-marker { display: none; }
.task.ok[open] > summary { padding-bottom: 4px; }
.task.ok > .runs { padding: 0 16px 10px; }
.chev::before { content: "▸"; display: inline-block; width: 18px; text-align: center; color: var(--ink-3); transition: transform .15s; }
.task.ok[open] .chev::before { transform: rotate(90deg); }
.passed-fold summary { cursor: pointer; list-style: none; color: var(--ink-2); font-size: 13px; padding: 8px 4px 0; }
.passed-fold summary::-webkit-details-marker { display: none; }
.passed-fold summary::before { content: "▸"; display: inline-block; width: 16px; transition: transform .15s; }
.passed-fold[open] summary::before { transform: rotate(90deg); }
.passed-fold .runs { margin-top: 4px; }
.task-id { flex: 1 1 0; min-width: 140px; }
@media (max-width: 640px) { .task-head .facts { flex: 0 0 100%; margin-left: 0; text-align: right; } }
.task-id .task-name { margin: 0; }
.run .tm.leak { color: var(--bad-text); font-weight: 650; }
.panel > .legend { margin-top: 14px; }
.band-label .ico { width: 20px; height: 20px; }
.result-tag { display: inline-block; margin-bottom: 8px; padding: 1px 9px; border: 1px solid var(--grid); border-radius: 999px; color: var(--ink-3); font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
.verdict .banner.good, .verdict .banner.bad, .verdict .banner.warn { background: transparent; }
.verdict .banner.good h2, .verdict .banner.bad h2, .verdict .banner.warn h2 { color: var(--ink); }
.verdict .check-list li.ok, .verdict .check-list li.ko { background: var(--wash); }
.verdict .check-list li.ok .lab, .verdict .check-list li.ko .lab { color: var(--ink-3); }
.verdict .pill.good, .verdict .pill.bad { background: var(--wash); color: var(--ink-2); }
.strip i.err, .timeline .strip button.err, .legend i.err { background: var(--warn); }
.call.err { border-color: var(--warn); }
.dot-bad { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; flex: none; }
.tab .dot-bad { margin-left: 2px; }
.verdict .check-list li.ko { grid-template-columns: minmax(0, 1fr) auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a class="brand" href="#"><i></i>Harbor trajectories</a><button class="btn" id="theme" type="button">Light / dark</button></div>
  <main id="main"></main>
</div>
<script id="data" type="text/plain">__TRIALS_JSON__</script>
<script>
(function () {
  const trials = JSON.parse(document.getElementById('data').textContent);
  const main = document.getElementById('main');
  const WAIT_SECONDS = 30;
  const PREVIEW_LENGTH = 140;
  const SECONDS_PER_MINUTE = 60;
  const SHORT_SECONDS = 10;
  const MIN_STEP_SECONDS = 0.5;
  const ICONS = {

    page.appendChild(el('div', { class: 'overview' }, [summaryBand(), pickerNode(all)]));
    page.appendChild(comboPanel(all.find((c) => c.key === selectedKey)));
    return page;
  }

  document.getElementById('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.theme = dark ? 'light' : 'dark';
  });
  let lastView = null;
  let overviewScroll = 0;
  function scrollTarget(keepPosition, here, onTrial) {
    if (keepPosition) return here;
    return onTrial ? 0 : overviewScroll;
  }
  function render(keepPosition) {
    const hash = decodeURIComponent(location.hash.slice(1));
    const trial = trials.find((t) => keyOf(t) === hash);
    const here = window.scrollY;
    if (lastView === '') overviewScroll = here;
    main.replaceChildren(trial ? trialPage(trial) : overviewPage());
    window.scrollTo({ top: scrollTarget(keepPosition, here, Boolean(trial)), behavior: 'instant' });
    lastView = trial ? hash : '';
    fitCommands();
  }
  window.addEventListener('hashchange', () => render());
  window.addEventListener('resize', fitCommands);
  if (document.fonts) document.fonts.ready.then(fitCommands);
  render();
})();
</script>
</body>
</html>
