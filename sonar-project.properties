# SonarQube Cloud Configuration
sonar.projectKey=SonarSource_sonarqube-cli
sonar.organization=sonarsource
sonar.host.url=https://sonarcloud.io
sonar.sources=src,docs
sonar.tests=tests
sonar.javascript.lcov.reportPaths=tests/coverage/reports/unit/lcov.info,tests/coverage/reports/integration/lcov.info

# Exclude generated documentation artifacts (produced by build-scripts/docs/generate-docs.ts)
sonar.exclusions=docs/data/commands.json,docs/llms.txt,docs/sitemap.xml
